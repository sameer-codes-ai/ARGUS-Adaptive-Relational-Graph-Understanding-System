[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
version = "0.1.0"
description = "Adaptive Relational Graph Understanding for Surveillance"
dependencies = [
    "torch>=2.1",
    "numpy>=1.26",
    "opencv-python>=4.8",
    "PyYAML>=6.0",
    "tqdm>=4.66",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

