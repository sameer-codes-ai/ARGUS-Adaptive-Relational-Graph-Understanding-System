# Ablation 1: No Graph (Visual tokens bypass scene graph and EdgeGAT directly into Temporal Transformer)
data:
  train_manifest: "data/train_clean.csv"
  val_manifest: "data/val_clean.csv"
  test_manifest: "data/test_clean.csv"
  frames: 16
  image_size: 128

model:
  image_size: 128
  patch_size: 16
  dim: 256
  graph_dim: 128
  max_objects: 16
  temporal_layers: 4
  heads: 4
  keep_ratio: 0.5
  memory_size: 16
  sampling_threshold: 0.12
  max_frame_gap: 4
  use_pretrained_backbone: true
  backbone_name: "convnext_tiny"
  backbone_frozen: true
  use_semantic_detector: false
  detector_name: "yolo11n.pt"
  detector_confidence: 0.3
  semantic_schema_version: "threat5"
  node_visual_dim: 0
  allow_component_fallbacks: false
  backbone_pretrained: true
  tracking_iou_threshold: 0.1
  use_graph: false
  use_edge_attrs: false
  uniform_sampling: false
  use_memory: true

training:
  batch_size: 4
  epochs: 15
  lr: 0.0001
  weight_decay: 0.0001
  smoothness_weight: 0.1
  sparsity_weight: 0.01
  mil_weight: 0.5
  workers: 0
  seed: 42
  output_dir: "outputs/ablations/ablation_1_no_graph"
