# ARGUS Training Configuration: Ryzen 7 7840HS + 16GB RAM + 6GB RTX 3050 (Eco-Mode)
# Specifically tuned to run full model training in the background while keeping
# the system 100% fluid and responsive for normal daily multi-tasking:
# (Web browsing with 20+ tabs, 1080p/4K YouTube playback, Discord, VS Code, office documents).

data:
  train_manifest: "data/train_clean.csv"
  val_manifest: "data/val_clean.csv"
  test_manifest: "data/test_clean.csv"
  frames: 16
  image_size: 128

model:
  image_size: 128
  patch_size: 16
  dim: 256
  graph_dim: 128
  max_objects: 16
  temporal_layers: 4
  heads: 4
  keep_ratio: 0.5
  memory_size: 16
  sampling_threshold: 0.12
  max_frame_gap: 4
  use_pretrained_backbone: true
  backbone_name: "convnext_tiny"
  backbone_frozen: true
  use_semantic_detector: true
  detector_name: "yolo11n.pt"
  detector_confidence: 0.3
  semantic_schema_version: "threat5"
  node_visual_dim: 64
  allow_component_fallbacks: false
  backbone_pretrained: true
  tracking_iou_threshold: 0.1

training:
  batch_size: 4             # Compact batch size: fits in ~2.0 GB VRAM with FP16 AMP
  epochs: 15
  lr: 0.0001
  weight_decay: 0.0001
  smoothness_weight: 0.1
  sparsity_weight: 0.01
  mil_weight: 0.5
  workers: 0                # 0 workers avoids Windows multiprocessing memory overhead
  seed: 42
  output_dir: "outputs/checkpoints_rlvd_full"
  
  # Multi-Tasking Eco-Mode Parameters:
  eco_mode: true            # Activates BelowNormal OS scheduling
  cpu_threads: 4            # Caps PyTorch to 4 threads (leaves 12 threads free on Ryzen 7840HS)
  max_vram_fraction: 0.65   # Caps PyTorch to 3.9 GB VRAM (reserves 2.1 GB VRAM for Windows/Browsers)
