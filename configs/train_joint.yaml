data:
  train_manifest: "data/train_all.csv"
  val_manifest: "data/val_all.csv"
  test_manifest: "data/test_all.csv"
  frames: 16
  image_size: 128

model:
  image_size: 128
  patch_size: 16
  dim: 256
  graph_dim: 128
  max_objects: 16
  temporal_layers: 4
  heads: 4
  keep_ratio: 0.5
  memory_size: 16
  sampling_threshold: 0.12
  max_frame_gap: 4
  use_pretrained_backbone: true
  backbone_name: "convnext_tiny"
  backbone_frozen: false
  use_semantic_detector: true
  detector_name: "yolo11n.pt"
  detector_confidence: 0.3
  node_visual_dim: 64
  allow_component_fallbacks: false
  backbone_pretrained: true
  tracking_iou_threshold: 0.1

training:
  batch_size: 4
  epochs: 10
  lr: 0.00005
  backbone_lr: 0.00001
  weight_decay: 0.0001
  smoothness_weight: 0.1
  sparsity_weight: 0.01
  mil_weight: 0.5
  output_dir: "outputs/checkpoints_joint"
